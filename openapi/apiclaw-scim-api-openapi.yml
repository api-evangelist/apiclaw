  /scim/v2/placeholders:
    get:
      description: 'List user rows whose id is another account''s SSO identity or email.


        An earlier release provisioned a group member it could not match as a user keyed

        by the raw member value, and that row now shadows the account the value really

        names, so every push of that member is refused. This lists those rows so an

        operator can fold each one into the account it shadows with

        ``POST /scim/v2/placeholders/{user_id}/merge``. A row that has an SSO identity of

        its own or owns virtual keys is left out: someone uses that account.'
      operationId: list_placeholders_scim_v2_placeholders_get
      parameters:
      - in: query
        name: feature
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SCIMPlaceholder'
                title: Response List Placeholders Scim V2 Placeholders Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Placeholders
      tags:
      - SCIM
  /scim/v2/placeholders/{user_id}/merge:
    post:
      description: 'Fold a placeholder user into the one account its id names by SSO identity or email.


        The account is added to every team the placeholder is on, then the placeholder is

        deleted the way ``DELETE /scim/v2/Users/{id}`` deletes a user, so the next group

        push resolves the member value to the real account. Refused with 409 when the row

        has an SSO identity of its own, owns virtual keys, or names no account or several.'
      operationId: merge_placeholder_scim_v2_placeholders__user_id__merge_post
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          title: User ID
          type: string
      - in: query
        name: feature
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMPlaceholderMergeResult'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Merge Placeholder
      tags:
      - SCIM
components:
  schemas:
    SCIMUserName:
      properties:
        familyName:
          anyOf:
          - type: string
          - type: 'null'
          title: Familyname
        formatted:
          anyOf:
          - type: string
          - type: 'null'
          title: Formatted
        givenName:
          anyOf:
          - type: string
          - type: 'null'
          title: Givenname
        honorificPrefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Honorificprefix
        honorificSuffix:
          anyOf:
          - type: string
          - type: 'null'
          title: Honorificsuffix
        middleName:
          anyOf:
          - type: string
          - type: 'null'
          title: Middlename
      title: SCIMUserName
      type: object
    SCIMMember:
      properties:
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        value:
          title: Value
          type: string
      required:
      - value
      title: SCIMMember
      type: object
    SCIMPlaceholderMergeResult:
      properties:
        merged_into_user_id:
          title: Merged Into User Id
          type: string
        placeholder_user_id:
          title: Placeholder User Id
          type: string
        team_ids:
          items:
            type: string
          title: Team Ids
          type: array
      required:
      - placeholder_user_id
      - merged_into_user_id
      - team_ids
      title: SCIMPlaceholderMergeResult
      type: object
    SCIMListResponse:
      properties:
        Resources:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMUser-Output'
            type: array
          - items:
              $ref: '#/components/schemas/SCIMGroup'
            type: array
          title: Resources
        itemsPerPage:
          anyOf:
          - type: integer
          - type: 'null'
          default: 10
          title: Itemsperpage
        schemas:
          default:
          - urn:ietf:params:scim:api:messages:2.0:ListResponse
          items:
            type: string
          title: Schemas
          type: array
        startIndex:
          anyOf:
          - type: integer
          - type: 'null'
          default: 1
          title: Startindex
        totalResults:
          title: Totalresults
          type: integer
      required:
      - totalResults
      - Resources
      title: SCIMListResponse
      type: object
    SCIMPatchOperation:
      properties:
        op:
          title: Op
          type: string
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        value:
          anyOf:
          - {}
          - type: 'null'
          title: Value
      required:
      - op
      title: SCIMPatchOperation
      type: object
    SCIMMultiValuedAttribute:
      properties:
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        primary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Primary
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        value:
          title: Value
          type: string
      required:
      - value
      title: SCIMMultiValuedAttribute
      type: object
    SCIMUserEmail:
      properties:
        primary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Primary
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        value:
          format: email
          title: Value
          type: string
      required:
      - value
      title: SCIMUserEmail
      type: object
    SCIMGroup:
      properties:
        displayName:
          title: Displayname
          type: string
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
        members:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMMember'
            type: array
          - type: 'null'
          title: Members
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        schemas:
          items:
            type: string
          title: Schemas
          type: array
      required:
      - schemas
      - displayName
      title: SCIMGroup
      type: object
    SCIMServiceProviderConfig:
      properties:
        authenticationSchemes:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Authenticationschemes
        bulk:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        changePassword:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        etag:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        filter:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        patch:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: true
        schemas:
          default:
          - urn:ietf:params:scim:schemas:core:2.0:ServiceProviderConfig
          items:
            type: string
          title: Schemas
          type: array
        sort:
          $ref: '#/components/schemas/SCIMFeature'
          default:
            supported: false
      title: SCIMServiceProviderConfig
      type: object
    SCIMPlaceholder:
      description: A user row keyed by a value that names another account by SSO identity or email.
      properties:
        placeholder_user_id:
          title: Placeholder User Id
          type: string
        resolved_user_ids:
          items:
            type: string
          title: Resolved User Ids
          type: array
        team_ids:
          items:
            type: string
          title: Team Ids
