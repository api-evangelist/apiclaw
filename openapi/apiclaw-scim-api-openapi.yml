          - type: 'null'
          title: Feature
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
