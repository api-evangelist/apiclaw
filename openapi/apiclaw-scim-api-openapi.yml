        name: startIndex
        required: false
        schema:
          default: 1
          minimum: 1
          title: Startindex
          type: integer
      - in: query
        name: count
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          title: Count
          type: integer
      - in: query
        name: filter
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Filter
      - in: query
        name: feature
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Groups
      tags:
      - SCIM
    post:
      description: Create a group according to SCIM v2 protocol
      operationId: create_group_scim_v2_Groups_post
      parameters:
      - in: query
        name: feature
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMGroup'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMGroup'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Create Group
      tags:
      - SCIM
