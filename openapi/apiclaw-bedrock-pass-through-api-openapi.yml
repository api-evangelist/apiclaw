openapi: 3.2.0
info:
  title: LiteLLM Bedrock Pass-through API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Bedrock Pass-through
paths:
  /bedrock/{endpoint}:
    get:
      tags:
      - Bedrock Pass-through
      summary: Bedrock Proxy Route
      description: 'This is the v1 passthrough for Bedrock.

        V2 is handled by the `/bedrock/v2` endpoint.

        Docs'
      operationId: bedrock_proxy_route_bedrock__endpoint__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: endpoint
        in: path
        required: true
        schema:
          type: string
          title: Endpoint
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
