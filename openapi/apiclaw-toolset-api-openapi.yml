openapi: 3.2.0
info:
  title: LiteLLM Toolset API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Toolset
paths:
  /toolset/{toolset_name}/mcp:
    get:
      summary: Toolset Mcp Route
      description: 'Namespace a toolset as its own MCP endpoint.


        Connecting to /toolset//mcp exposes exactly the tools defined in

        the toolset. Access is enforced: non-admin API keys must have the toolset

        listed in their object_permission.mcp_toolsets grant list, or the request

        will be rejected with a 403.'
      operationId: toolset_mcp_route_toolset__toolset_name__mcp_get
      parameters:
      - name: toolset_name
        in: path
        required: true
        schema:
          type: string
          title: Toolset Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Toolset
