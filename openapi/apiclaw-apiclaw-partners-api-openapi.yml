openapi: 3.2.0
info:
  title: LiteLLM APIClaw Partners API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: APIClaw Partners
paths:
  /apiclaw/partner/me:
    get:
      tags:
      - APIClaw Partners
      summary: Partner Me
      operationId: partner_me_apiclaw_partner_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_PartnerMeOut'
      security:
      - APIKeyHeader: []
  /apiclaw/partner/checkout:
    post:
      tags:
      - APIClaw Partners
      summary: Partner Checkout
      operationId: partner_checkout_apiclaw_partner_checkout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_CheckoutOut'
      security:
      - APIKeyHeader: []
  /apiclaw/admin/partners:
    get:
      tags:
      - APIClaw Partners
      summary: Admin List Partners
      operationId: admin_list_partners_apiclaw_admin_partners_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: Search
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_PartnerListOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apiclaw/admin/partners/activate:
    post:
      tags:
      - APIClaw Partners
      summary: Admin Activate Partner
      operationId: admin_activate_partner_apiclaw_admin_partners_activate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_ActivateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_PartnerOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /apiclaw/admin/partners/{user_id}/revoke:
    post:
      tags:
      - APIClaw Partners
      summary: Admin Revoke Partner
      operationId: admin_revoke_partner_apiclaw_admin_partners__user_id__revoke_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/_PartnerOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    _PartnerOut:
      properties:
        user_id:
          type: string
          title: User Id
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        code:
          type: string
          title: Code
        active:
          type: boolean
          title: Active
        source:
          type: string
          enum:
          - payment
          - admin
          title: Source
        payment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Id
        activated_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Activated By
        activated_at:
          type: string
          title: Activated At
        revoked_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked At
      type: object
      required:
      - user_id
      - email
      - code
      - active
      - source
      - payment_id
      - activated_by
      - activated_at
      - revoked_at
      title: _PartnerOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    _ActivateRequest:
      properties:
        email:
          type: string
          maxLength: 320
          minLength: 3
          title: Email
      type: object
      required:
      - email
      title: _ActivateRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    _CheckoutOut:
      properties:
        invoice_url:
          type: string
          title: Invoice Url
      type: object
      required:
      - invoice_url
      title: _CheckoutOut
    _PartnerListOut:
      properties:
        results:
          items:
            $ref: '#/components/schemas/_PartnerOut'
          type: array
          title: Results
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        page_size:
          type: integer
          title: Page Size
        total_pages:
          type: integer
          title: Total Pages
      type: object
      required:
      - results
      - total
      - page
      - page_size
      - total_pages
      title: _PartnerListOut
    _PartnerMeOut:
      properties:
        status:
          type: string
          enum:
          - none
          - active
          title: Status
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
        activated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Activated At
      type: object
      required:
      - status
      - code
      - activated_at
      title: _PartnerMeOut
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
    HTTPBearer:
      type: http
      scheme: bearer
