  /v1/mcp/tools:
    get:
      tags:
      - MCP
      summary: Get Mcp Tools
      description: Get all MCP tools available for the current key, including those from access groups
      operationId: get_mcp_tools_v1_mcp_tools_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /v1/mcp/access_groups:
    get:
      tags:
      - MCP
      summary: Get Mcp Access Groups
      description: Get all available MCP access groups from the database AND config
      operationId: get_mcp_access_groups_v1_mcp_access_groups_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /v1/mcp/network/client-ip:
    get:
      tags:
      - MCP
      summary: Get Client Ip
      description: Returns the caller's IP address as seen by the proxy.
      operationId: get_client_ip_v1_mcp_network_client_ip_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /v1/mcp/registry.json:
    get:
      tags:
      - MCP
      summary: Get Mcp Registry
      description: 'MCP registry endpoint. Spec: https://github.com/modelcontextprotocol/registry'
      operationId: get_mcp_registry_v1_mcp_registry_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/mcp/server:
    get:
      tags:
      - MCP
      summary: Fetch All Mcp Servers
      description: Returns the mcp server list with associated teams
      operationId: fetch_all_mcp_servers_v1_mcp_server_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: team_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter MCP servers by team scope. When provided, returns only servers the team has access to plus globally available (allow_all_keys) servers. Used by the Create Key UI to show team-scoped MCP servers.
          title: Team Id
        description: Filter MCP servers by team scope. When provided, returns only servers the team has access to plus globally available (allow_all_keys) servers. Used by the Create Key UI to show team-scoped MCP servers.
      - name: connected_app_view
        in: query
        required: false
        schema:
          type: boolean
          description: 'Annotate each returned server with connected_app_reachable: whether a connected app authorized by the calling user (a gateway OAuth session) is served this server on the aggregate MCP endpoint.'
          default: false
          title: Connected App View
        description: 'Annotate each returned server with connected_app_reachable: whether a connected app authorized by the calling user (a gateway OAuth session) is served this server on the aggregate MCP endpoint.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiteLLM_MCPServerTable'
                title: Response Fetch All Mcp Servers V1 Mcp Server Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - MCP
      summary: Add Mcp Server
      description: Allows creation of mcp servers
      operationId: add_mcp_server_v1_mcp_server_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMCPServerRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_MCPServerTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - MCP
      summary: Edit Mcp Server
      description: Allows deleting mcp serves in the db
      operationId: edit_mcp_server_v1_mcp_server_put
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMCPServerRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_MCPServerTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/mcp/server/health:
    get:
      tags:
      - MCP
      summary: Health Check Servers
      description: Health check for MCP servers
      operationId: health_check_servers_v1_mcp_server_health_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: server_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Server IDs to check. If not provided, checks all accessible servers.
          title: Server Ids
        description: Server IDs to check. If not provided, checks all accessible servers.
      - name: include_reachability
        in: query
        required: false
        schema:
          type: boolean
          description: Allow the 'reachable' status for responding servers whose authentication is unchecked.
          default: false
          title: Include Reachability
        description: Allow the 'reachable' status for responding servers whose authentication is unchecked.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/mcp/server/register:
    post:
      tags:
      - MCP
      summary: Register Mcp Server
      description: Submit a new MCP server for admin review (non-admin users). Mirrors POST /guardrails/register.
      operationId: register_mcp_server_v1_mcp_server_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMCPServerRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_MCPServerTable'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /v1/mcp/sessions:
    get:
      tags:
      - MCP
      summary: Get Mcp Gateway Sessions
      description: Live stateful MCP gateway sessions on this proxy worker, grouped by AI client and by user.
      operationId: get_mcp_gateway_sessions_v1_mcp_sessions_get
      security:
      - APIKeyHeader: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPGatewaySessionsResponse'
    delete:
      tags:
      - MCP
      summary: Delete Mcp Gateway Sessions
      description: Force-close live stateful MCP gateway sessions on this proxy worker, selected by session id prefix and/or by the LiteLLM user that opened them (proxy admin only).
      operationId: delete_mcp_gateway_sessions_v1_mcp_sessions_delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: session_id_prefix
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 8
          - type: 'null'
          title: Session Id Prefix
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPGatewaySessionsTerminateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/mcp/server/submissions:
    get:
      tags:
      - MCP
      summary: Get Mcp Server Submissions
      description: Returns all MCP servers submitted by non-admin users (admin review queue). Mirrors GET /guardrails/submissions.
      operationId: get_mcp_server_submissions_v1_mcp_server_submissions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPSubmissionsSummary'
      security:
      - APIKeyHeader: []
  /v1/mcp/server/{server_id}/pin:
    post:
      tags:
      - MCP
      summary: Pin Mcp Server Tools
      description: Pin the server's current upstream tool list, descriptions and input schemas (admin only). tools/list serves the pinned catalog from now on and an upstream change raises an mcp_pinned_tools_changed alert.
      operationId: pin_mcp_server_tools_v1_mcp_server__server_id__pin_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/PinnedMCPTool'
                title: Response Pin Mcp Server Tools V1 Mcp Server  Server Id  Pin Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - MCP
      summary: Unpin Mcp Server Tools
      description: Unpin the server's tool list (admin only); tools/list serves the live upstream catalog again.
      operationId: unpin_mcp_server_tools_v1_mcp_server__server_id__pin_delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: server_id
        in: path
        required: true
        schema:
          type: string
          title: Server Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Unpin Mcp Server Tools V1 Mcp Server  Server Id  Pin Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/mcp/server/{server_id}/approve:
    put:
      tags:
      - MCP
      summary: Approve Mcp Server Submission
      description: Approve a pending MCP server submission (admin only). Mirrors PUT /guardrails/{id}/approve.
      operationId: approve_mcp_server_submission_v1_mcp_server__server_id__approve_put
      security:
      - APIKeyHeader: []
      parameters:
