openapi: 3.2.0
info:
  title: LiteLLM Responses API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Responses
paths:
  /openai/v1/responses:
    post:
      tags:
      - Responses
      summary: Responses Api
      description: 'Follows the OpenAI Responses API spec: https://platform.openai.com/docs/api-reference/responses


        Supports background mode with polling_via_cache for partial response retrieval.

        When background=true and polling_via_cache is enabled, returns a polling_id immediately

        and streams the response in the background, updating Redis cache.


        ```bash

        # Normal request

        curl -X POST http://localhost:4000/v1/responses -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234" -d ''{

        "model": "gpt-4o",

        "input": "Tell me about AI"

        }''


        # Background request with polling

        curl -X POST http://localhost:4000/v1/responses -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234" -d ''{

        "model": "gpt-4o",

        "input": "Tell me about AI",

        "background": true

        }''

        ```'
      operationId: responses_api_openai_v1_responses_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesAPIResponse'
            text/event-stream:
              schema:
                type: string
                description: Server sent events when stream=true
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - input
              - model
              properties:
                include:
                  anyOf:
                  - items:
                      enum:
                      - file_search_call.results
                      - web_search_call.results
                      - web_search_call.action.sources
                      - message.input_image.image_url
                      - computer_call_output.output.image_url
                      - code_interpreter_call.outputs
                      - reasoning.encrypted_content
                      - message.output_text.logprobs
                      type: string
                    type: array
                  - type: 'null'
                  title: Include
                instructions:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Instructions
                max_output_tokens:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  title: Max Output Tokens
                metadata:
                  anyOf:
                  - additionalProperties: true
                    type: object
                  - type: 'null'
                  title: Metadata
                parallel_tool_calls:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  title: Parallel Tool Calls
                previous_response_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Previous Response Id
                reasoning:
                  anyOf:
                  - $ref: '#/components/schemas/Reasoning'
                  - type: 'null'
                store:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  title: Store
                background:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  title: Background
                stream:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  title: Stream
                temperature:
                  anyOf:
                  - type: number
                  - type: 'null'
                  title: Temperature
                text:
                  anyOf:
                  - $ref: '#/components/schemas/ResponseTextConfigParam'
                  - type: 'null'
                tool_choice:
                  anyOf:
                  - enum:
                    - none
                    - auto
                    - required
                    type: string
                  - $ref: '#/components/schemas/ToolChoiceAllowedParam'
                  - $ref: '#/components/schemas/ToolChoiceTypesParam'
                  - $ref: '#/components/schemas/ToolChoiceFunctionParam'
                  - $ref: '#/components/schemas/ToolChoiceMcpParam'
                  - $ref: '#/components/schemas/ToolChoiceCustomParam'
                  - $ref: '#/components/schemas/ToolChoiceApplyPatchParam'
                  - $ref: '#/components/schemas/ToolChoiceShellParam'
                  - type: 'null'
                  title: Tool Choice
                tools:
                  anyOf:
                  - items:
                      anyOf:
                      - $ref: '#/components/schemas/FunctionToolParam'
                      - $ref: '#/components/schemas/FileSearchToolParam'
                      - $ref: '#/components/schemas/openai__types__responses__computer_tool_param__ComputerToolParam'
                      - $ref: '#/components/schemas/ComputerUsePreviewToolParam'
                      - $ref: '#/components/schemas/WebSearchToolParam'
                      - $ref: '#/components/schemas/Mcp'
                      - $ref: '#/components/schemas/CodeInterpreter'
                      - $ref: '#/components/schemas/ImageGeneration'
                      - $ref: '#/components/schemas/LocalShell'
                      - $ref: '#/components/schemas/FunctionShellToolParam'
                      - $ref: '#/components/schemas/CustomToolParam'
                      - $ref: '#/components/schemas/NamespaceToolParam'
                      - $ref: '#/components/schemas/ToolSearchToolParam'
                      - $ref: '#/components/schemas/WebSearchPreviewToolParam'
                      - $ref: '#/components/schemas/ApplyPatchToolParam'
                      - $ref: '#/components/schemas/litellm__types__llms__openai__ComputerToolParam'
                      - $ref: '#/components/schemas/ShellToolParam'
                    type: array
                  - type: 'null'
                  title: Tools
                top_p:
                  anyOf:
                  - type: number
                  - type: 'null'
                  title: Top P
                truncation:
                  anyOf:
                  - enum:
                    - auto
                    - disabled
                    type: string
                  - type: 'null'
                  title: Truncation
                user:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: User
                service_tier:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Service Tier
                safety_identifier:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Safety Identifier
                prompt:
                  anyOf:
                  - $ref: '#/components/schemas/PromptObject'
                  - type: 'null'
                max_tool_calls:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  title: Max Tool Calls
                prompt_cache_key:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Prompt Cache Key
                prompt_cache_retention:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Prompt Cache Retention
                prompt_cache_options:
                  anyOf:
                  - $ref: '#/components/schemas/PromptCacheOptions'
                  - type: 'null'
                stream_options:
                  anyOf:
                  - $ref: '#/components/schemas/ResponsesAPIStreamOptions'
                  - type: 'null'
                top_logprobs:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  title: Top Logprobs
                partial_images:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  title: Partial Images
                context_management:
                  anyOf:
                  - items:
                      $ref: '#/components/schemas/ContextManagementEntry'
                    type: array
                  - type: 'null'
                  title: Context Management
                input:
                  anyOf:
                  - type: string
                  - items:
                      anyOf:
                      - $ref: '#/components/schemas/EasyInputMessageParam'
                      - $ref: '#/components/schemas/ResponsesAPIRequestParams_Message'
                      - $ref: '#/components/schemas/ResponseOutputMessageParam'
                      - $ref: '#/components/schemas/ResponseFileSearchToolCallParam'
                      - $ref: '#/components/schemas/ResponseComputerToolCallParam'
                      - $ref: '#/components/schemas/ComputerCallOutput'
                      - $ref: '#/components/schemas/ResponseFunctionWebSearchParam'
                      - $ref: '#/components/schemas/ResponseFunctionToolCallParam'
                      - $ref: '#/components/schemas/FunctionCallOutput'
                      - $ref: '#/components/schemas/ToolSearchCall'
                      - $ref: '#/components/schemas/ResponseToolSearchOutputItemParamParam'
                      - $ref: '#/components/schemas/ResponseReasoningItemParam'
                      - $ref: '#/components/schemas/ResponseCompactionItemParamParam'
                      - $ref: '#/components/schemas/ResponsesAPIRequestParams_ImageGenerationCall'
                      - $ref: '#/components/schemas/ResponseCodeInterpreterToolCallParam'
                      - $ref: '#/components/schemas/LocalShellCall'
                      - $ref: '#/components/schemas/LocalShellCallOutput'
                      - $ref: '#/components/schemas/ShellCall'
                      - $ref: '#/components/schemas/ShellCallOutput'
                      - $ref: '#/components/schemas/ApplyPatchCall'
                      - $ref: '#/components/schemas/ApplyPatchCallOutput'
                      - $ref: '#/components/schemas/McpListTools'
                      - $ref: '#/components/schemas/McpApprovalRequest'
                      - $ref: '#/components/schemas/ResponsesAPIRequestParams_McpApprovalResponse'
                      - $ref: '#/components/schemas/McpCall'
                      - $ref: '#/components/schemas/ResponseCustomToolCallOutputParam'
                      - $ref: '#/components/schemas/ResponseCustomToolCallParam'
                      - $ref: '#/components/schemas/ItemReference'
                    type: array
                  title: Input
                model:
                  title: Model
                  type: string
