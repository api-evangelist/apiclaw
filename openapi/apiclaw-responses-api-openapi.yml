components:
  schemas:
    ResponseApplyPatchToolCall:
      properties:
        id:
          type: string
          title: Id
        call_id:
          type: string
          title: Call Id
        operation:
          anyOf:
          - $ref: '#/components/schemas/OperationCreateFile'
          - $ref: '#/components/schemas/OperationDeleteFile'
          - $ref: '#/components/schemas/OperationUpdateFile'
          title: Operation
        status:
          type: string
          enum:
          - in_progress
          - completed
          title: Status
        type:
          type: string
          const: apply_patch_call
          title: Type
        created_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By
      additionalProperties: true
      type: object
      required:
      - id
      - call_id
      - operation
      - status
      - type
      title: ResponseApplyPatchToolCall
      description: A tool call that applies file diffs by creating, deleting, or updating files.
    OperationCreateFile:
      properties:
        diff:
          type: string
          title: Diff
        path:
          type: string
          title: Path
        type:
          type: string
          const: create_file
          title: Type
      additionalProperties: true
      type: object
      required:
      - diff
      - path
      - type
      title: OperationCreateFile
      description: Instruction describing how to create a file via the apply_patch tool.
    ToolChoiceMcpParam:
      properties:
        server_label:
          type: string
          title: Server Label
        type:
          type: string
          const: mcp
          title: Type
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      additionalProperties: true
      type: object
      required:
      - server_label
      - type
      title: ToolChoiceMcpParam
      description: Use this option to force the model to call a specific tool on a remote MCP server.
    ActionScreenshot:
      properties:
        type:
          type: string
          const: screenshot
          title: Type
      additionalProperties: true
      type: object
      required:
      - type
      title: ActionScreenshot
      description: A screenshot action.
    ToolChoiceShellParam:
      properties:
        type:
          type: string
          const: shell
          title: Type
      additionalProperties: true
      type: object
      required:
      - type
      title: ToolChoiceShellParam
      description: Forces the model to call the shell tool when a tool call is required.
    ApplyPatchCallOperationUpdateFile:
      description: Instruction for updating an existing file via the apply_patch tool.
      properties:
        diff:
          title: Diff
          type: string
        path:
          title: Path
          type: string
        type:
          const: update_file
          title: Type
          type: string
      required:
      - diff
      - path
      - type
      title: ApplyPatchCallOperationUpdateFile
      type: object
    ResponseFunctionShellCallOutputContentParam:
      description: Captured stdout and stderr for a portion of a shell tool call output.
      properties:
        outcome:
          anyOf:
          - $ref: '#/components/schemas/OutcomeTimeout'
          - $ref: '#/components/schemas/OutcomeExit'
          title: Outcome
        stderr:
          title: Stderr
          type: string
        stdout:
          title: Stdout
          type: string
      required:
      - outcome
      - stderr
      - stdout
      title: ResponseFunctionShellCallOutputContentParam
      type: object
    ResponseFormatJSONObject:
      properties:
        type:
          type: string
          const: json_object
          title: Type
      additionalProperties: true
      type: object
      required:
      - type
      title: ResponseFormatJSONObject
      description: 'JSON object response format.


        An older method of generating JSON responses.

        Using `json_schema` is recommended for models that support it. Note that the

        model will not generate JSON without a system or user message instructing it

