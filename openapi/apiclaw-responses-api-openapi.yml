openapi: 3.2.0
info:
  title: LiteLLM Responses API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.102.1
tags:
- name: Responses
paths:
  /openai/v1/responses:
    post:
      tags:
      - Responses
      summary: Responses Api
      description: 'Follows the OpenAI Responses API spec: https://platform.openai.com/docs/api-reference/responses


        Supports background mode with polling_via_cache for partial response retrieval.

        When background=true and polling_via_cache is enabled, returns a polling_id immediately

        and streams the response in the background, updating Redis cache.


        ```bash

        # Normal request

        curl -X POST http://localhost:4000/v1/responses -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234" -d ''{

        "model": "gpt-4o",

        "input": "Tell me about AI"

        }''


        # Background request with polling

        curl -X POST http://localhost:4000/v1/responses -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234" -d ''{

        "model": "gpt-4o",

        "input": "Tell me about AI",

        "background": true

        }''

        ```'
      operationId: responses_api_openai_v1_responses_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
