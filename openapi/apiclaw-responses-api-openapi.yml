  /cursor/chat/completions:
    post:
      tags:
      - Responses
      summary: Cursor Chat Completions
      description: 'Cursor BYOK endpoint. Accepts both request shapes Cursor sends to its OpenAI-compatible

        base URL and always answers in chat completions format.


        Cursor agent mode sends Responses API format bodies (`input`, flat tool defs, `reasoning`,

        custom tools) to the chat/completions path while expecting chat completions responses;

        those are routed through the Responses API pipeline and converted back. Genuine chat

        completions bodies (`messages` present) are routed through the standard chat completions

        pipeline, after normalizing each level of the `tools` array and `tool_choice` to the chat

        completions shapes OpenAI requires. Cursor mixes Responses API shapes into chat bodies

        per level, independently: a flat tool def (`{"type": "custom", "name": "ApplyPatch", ...}`)

        gets nested under `custom`, and a flat grammar format

        (`{"type": "grammar", "definition", "syntax"}`) gets wrapped as

        `{"type": "grammar", "grammar": {...}}` wherever it appears, including inside tool defs

        Cursor already sent pre-nested.


        ```bash

        curl -X POST http://localhost:4000/cursor/chat/completions -H "Content-Type: application/json" -H "Authorization: Bearer sk-1234" -d ''{

        "model": "gpt-4o",

        "input": [{"role": "user", "content": "Hello"}]

        }''

        Responds back in chat completions format.

        ```'
      operationId: cursor_chat_completions_cursor_chat_completions_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - APIKeyHeader: []
  /openai/v1/responses/{response_id}:
    get:
      tags:
      - Responses
      summary: Get Response
      description: 'Get a response by ID.


        Supports both:

        - Polling IDs (litellm_poll_*): Returns cumulative cached content from background responses

        - Provider response IDs: Passes through to provider API


        Follows the OpenAI Responses API spec: https://platform.openai.com/docs/api-reference/responses/get


        ```bash

        # Get polling response

        curl -X GET http://localhost:4000/v1/responses/litellm_poll_abc123 -H "Authorization: Bearer sk-1234"


        # Get provider response

        curl -X GET http://localhost:4000/v1/responses/resp_abc123 -H "Authorization: Bearer sk-1234"

        ```'
      operationId: get_response_openai_v1_responses__response_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Responses
      summary: Delete Response
      description: 'Delete a response by ID.


        Supports both:

        - Polling IDs (litellm_poll_*): Deletes from Redis cache

        - Provider response IDs: Passes through to provider API


        Follows the OpenAI Responses API spec: https://platform.openai.com/docs/api-reference/responses/delete


        ```bash

        curl -X DELETE http://localhost:4000/v1/responses/resp_abc123 -H "Authorization: Bearer sk-1234"

        ```'
      operationId: delete_response_openai_v1_responses__response_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
