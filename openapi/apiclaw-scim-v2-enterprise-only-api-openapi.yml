components:
  schemas:
    SCIMUserGroup:
      properties:
        value:
          type: string
          title: Value
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
          default: direct
      type: object
      required:
      - value
      title: SCIMUserGroup
    SCIMUserEmail:
      properties:
        value:
          type: string
          format: email
          title: Value
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
        primary:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Primary
      type: object
      required:
      - value
      title: SCIMUserEmail
    SCIMPatchOp:
      properties:
        schemas:
          items:
            type: string
          type: array
          title: Schemas
          default:
          - urn:ietf:params:scim:api:messages:2.0:PatchOp
        Operations:
          items:
            $ref: '#/components/schemas/SCIMPatchOperation'
          type: array
          title: Operations
      type: object
      required:
      - Operations
      title: SCIMPatchOp
    SCIMEnterpriseUser:
      properties:
        employeeNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Employeenumber
        costCenter:
          anyOf:
          - type: string
          - type: 'null'
          title: Costcenter
        organization:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization
        division:
          anyOf:
          - type: string
          - type: 'null'
          title: Division
        department:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
        manager:
          anyOf:
          - $ref: '#/components/schemas/SCIMUserManager'
          - type: 'null'
      type: object
      title: SCIMEnterpriseUser
    SCIMUserManager:
      properties:
        value:
          anyOf:
