          - type: string
          - type: 'null'
          title: Familyname
        givenName:
          anyOf:
          - type: string
          - type: 'null'
          title: Givenname
        formatted:
          anyOf:
          - type: string
          - type: 'null'
          title: Formatted
        middleName:
          anyOf:
          - type: string
          - type: 'null'
          title: Middlename
        honorificPrefix:
          anyOf:
          - type: string
          - type: 'null'
          title: Honorificprefix
        honorificSuffix:
          anyOf:
          - type: string
          - type: 'null'
          title: Honorificsuffix
      type: object
      title: SCIMUserName
    SCIMMember:
      properties:
        value:
          type: string
          title: Value
        display:
          anyOf:
          - type: string
          - type: 'null'
          title: Display
        type:
          anyOf:
          - type: string
          - type: 'null'
          title: Type
      type: object
      required:
