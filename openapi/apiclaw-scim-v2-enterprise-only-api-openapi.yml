openapi: 3.2.0
info:
  title: LiteLLM ✨ SCIM v2 (Enterprise Only) API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: ✨ SCIM v2 (Enterprise Only)
paths:
  /scim/v2:
    get:
      tags:
      - ✨ SCIM v2 (Enterprise Only)
      summary: Get Scim Base
      description: 'Base SCIM v2 endpoint for resource discovery per RFC 7644 Section 4.


        Returns a ListResponse of ResourceTypes supported by this SCIM service provider.

        Identity providers (Okta, Azure AD, etc.) use this endpoint for resource discovery.'
      operationId: get_scim_base_scim_v2_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: feature
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Feature
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /scim/v2/ResourceTypes:
    get:
      tags:
