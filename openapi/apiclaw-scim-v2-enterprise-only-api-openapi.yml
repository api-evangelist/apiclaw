          - type: 'null'
          title: Id
        externalId:
          anyOf:
          - type: string
          - type: 'null'
          title: Externalid
        meta:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Meta
        userName:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
        name:
          anyOf:
          - $ref: '#/components/schemas/SCIMUserName'
          - type: 'null'
        displayName:
          anyOf:
          - type: string
          - type: 'null'
          title: Displayname
        active:
          type: boolean
          title: Active
          default: true
        emails:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMUserEmail'
            type: array
          - type: 'null'
          title: Emails
        groups:
          anyOf:
          - items:
              $ref: '#/components/schemas/SCIMUserGroup'
            type: array
          - type: 'null'
          title: Groups
        entitlements:
