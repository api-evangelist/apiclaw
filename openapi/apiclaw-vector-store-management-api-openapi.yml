openapi: 3.2.0
info:
  title: LiteLLM Vector Store Management API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.102.1
tags:
- name: vector_store_management
paths:
  /v1/vector_store/list:
    get:
      description: 'List all available vector stores with optional filtering and pagination.

        Combines both in-memory vector stores and those stored in the database.

        Database is the source of truth - deleted stores are removed from memory, updated stores sync to memory.


        Parameters:

        - page: int - Page number for pagination (default: 1)

        - page_size: int - Number of items per page (default: 100)'
      operationId: list_vector_stores_v1_vector_store_list_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 100
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_ManagedVectorStoreListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Vector Stores
      tags:
      - vector_store_management
  /vector_store/delete:
    post:
      description: 'Delete a vector store from both database and in-memory registry.


        Parameters:

        - vector_store_id: str - ID of the vector store to delete'
      operationId: delete_vector_store_vector_store_delete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorStoreDeleteRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Delete Vector Store
      tags:
      - vector_store_management
  /vector_store/info:
    post:
      description: Return a single vector store's details
      operationId: get_vector_store_info_vector_store_info_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorStoreInfoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseLiteLLM_ManagedVectorStore'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Get Vector Store Info
      tags:
      - vector_store_management
  /vector_store/list:
    get:
      description: 'List all available vector stores with optional filtering and pagination.

        Combines both in-memory vector stores and those stored in the database.

        Database is the source of truth - deleted stores are removed from memory, updated stores sync to memory.


        Parameters:

        - page: int - Page number for pagination (default: 1)

        - page_size: int - Number of items per page (default: 100)'
      operationId: list_vector_stores_vector_store_list_get
      parameters:
      - in: query
        name: page
        required: false
        schema:
          default: 1
          title: Page
          type: integer
      - in: query
        name: page_size
        required: false
        schema:
          default: 100
          title: Page Size
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiteLLM_ManagedVectorStoreListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: List Vector Stores
      tags:
      - vector_store_management
  /vector_store/new:
    post:
      description: 'Create a new vector store.


        Parameters:

        - vector_store_id: str - Unique identifier for the vector store

        - custom_llm_provider: str - Provider of the vector store

        - vector_store_name: Optional[str] - Name of the vector store

        - vector_store_description: Optional[str] - Description of the vector store

        - vector_store_metadata: Optional[Dict] - Additional metadata for the vector store'
      operationId: new_vector_store_vector_store_new_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiteLLM_ManagedVectorStore'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: New Vector Store
      tags:
      - vector_store_management
  /vector_store/update:
    post:
      description: 'Update vector store details in both database and in-memory registry.

        The updated data is immediately synchronized to the in-memory registry.'
      operationId: update_vector_store_vector_store_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorStoreUpdateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - APIKeyHeader: []
      summary: Update Vector Store
      tags:
      - vector_store_management
components:
  schemas:
    LiteLLM_ManagedVectorStore:
      description: LiteLLM managed vector store object - this is is the object stored in the database
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        custom_llm_provider:
          title: Custom Llm Provider
          type: string
        litellm_credential_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Litellm Credential Name
        litellm_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Litellm Params
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        vector_store_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Store Description
        vector_store_id:
          title: Vector Store Id
          type: string
        vector_store_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: string
          - type: 'null'
          title: Vector Store Metadata
        vector_store_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Store Name
      title: LiteLLM_ManagedVectorStore
      type: object
    ResponseLiteLLM_ManagedVectorStore:
      properties:
        vector_store:
          $ref: '#/components/schemas/LiteLLM_ManagedVectorStoresTable'
      title: ResponseLiteLLM_ManagedVectorStore
      type: object
    VectorStoreUpdateRequest:
      properties:
        custom_llm_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Custom Llm Provider
        vector_store_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Store Description
        vector_store_id:
          title: Vector Store Id
          type: string
        vector_store_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Vector Store Metadata
        vector_store_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Store Name
      required:
      - vector_store_id
      title: VectorStoreUpdateRequest
      type: object
    LiteLLM_ManagedVectorStoreListResponse:
      description: Response format for listing vector stores
      properties:
        current_page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Current Page
        data:
          items:
            $ref: '#/components/schemas/LiteLLM_ManagedVectorStore'
          title: Data
          type: array
        object:
          const: list
          title: Object
          type: string
        total_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Count
        total_pages:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Pages
      title: LiteLLM_ManagedVectorStoreListResponse
      type: object
    VectorStoreInfoRequest:
      properties:
        vector_store_id:
          title: Vector Store Id
          type: string
      required:
      - vector_store_id
      title: VectorStoreInfoRequest
      type: object
    VectorStoreDeleteRequest:
      properties:
        vector_store_id:
          title: Vector Store Id
          type: string
      required:
      - vector_store_id
      title: VectorStoreDeleteRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    LiteLLM_ManagedVectorStoresTable:
      properties:
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
        custom_llm_provider:
          title: Custom Llm Provider
          type: string
        litellm_credential_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Litellm Credential Name
        litellm_params:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Litellm Params
        team_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Team Id
        updated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Updated At
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        vector_store_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Store Description
        vector_store_id:
          title: Vector Store Id
          type: string
        vector_store_metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Vector Store Metadata
        vector_store_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Vector Store Name
      required:
      - vector_store_id
      - custom_llm_provider
      title: LiteLLM_ManagedVectorStoresTable
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
