        name:
          type: string
          title: Name
        cache_control:
          $ref: '#/components/schemas/ChatCompletionCachedContent'
      type: object
      required:
      - role
      - content
      title: ChatCompletionSystemMessage
    ChatCompletionToolMessage:
      properties:
        role:
          type: string
