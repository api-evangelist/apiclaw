openapi: 3.2.0
info:
  title: LiteLLM Policies API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Policies
paths:
  /policies/usage/overview:
    get:
      tags:
      - Policies
      summary: Policies Usage Overview
      description: Return policy performance overview for the dashboard.
      operationId: policies_usage_overview_policies_usage_overview_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: Start Date
        description: YYYY-MM-DD
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: YYYY-MM-DD
          title: End Date
        description: YYYY-MM-DD
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageOverviewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/list:
    get:
      tags:
      - Policies
      summary: List Policies
      description: 'List all policies from the database and config.yaml. Optionally filter by version_status.


        Config-defined policies are returned with definition_location "config" and are treated

        as production versions. On a name conflict with a production DB policy, only the DB policy

        is returned, mirroring runtime resolution where only production DB versions override config.

        A draft or published DB version does not hide the config policy, since the config version

        is still the one being enforced.


        Query params:

        - version_status: Optional. One of "draft", "published", "production".

        If omitted, all versions are returned.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/list" \

        -H "Authorization: Bearer "

        curl -X GET "http://localhost:4000/policies/list?version_status=production" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "policies": [

        {

        "policy_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "version_number": 1,

        "version_status": "production",

        "inherit": null,

        "description": "Base guardrails for all requests",

        "guardrails_add": ["pii_masking"],

        "guardrails_remove": [],

        "condition": null,

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ],

        "total_count": 1

        }

        ```'
      operationId: list_policies_policies_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: version_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Version Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies:
    post:
      tags:
      - Policies
      summary: Create Policy
      description: 'Create a new policy.


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/policies" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "policy_name": "global-baseline",

        "description": "Base guardrails for all requests",

        "guardrails_add": ["pii_masking", "prompt_injection"],

        "guardrails_remove": []

        }''

        ```


        Example Response:

        ```json

        {

        "policy_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "inherit": null,

        "description": "Base guardrails for all requests",

        "guardrails_add": ["pii_masking", "prompt_injection"],

        "guardrails_remove": [],

        "condition": null,

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ```'
      operationId: create_policy_policies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /policies/name/{policy_name}/versions:
    get:
      tags:
      - Policies
      summary: List Policy Versions
      description: List all versions of a policy by name, ordered by version_number descending.
      operationId: list_policy_versions_policies_name__policy_name__versions_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_name
        in: path
        required: true
        schema:
          type: string
          title: Policy Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Policies
      summary: Create Policy Version
      description: 'Create a new draft version of a policy. Copies all fields from the source.

        Source is current production if source_policy_id is not provided.'
      operationId: create_policy_version_policies_name__policy_name__versions_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_name
        in: path
        required: true
        schema:
          type: string
          title: Policy Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}/status:
    put:
      tags:
      - Policies
      summary: Update Policy Version Status
      description: 'Update a policy version''s status. Valid transitions:

        - draft -> published

        - published -> production (demotes current production to published)

        - production -> published (demotes, policy becomes inactive)'
      operationId: update_policy_version_status_policies__policy_id__status_put
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyVersionStatusUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/compare:
    get:
      tags:
      - Policies
      summary: Compare Policy Versions
      description: 'Compare two policy versions. Query params: version_a, version_b (policy version IDs).'
      operationId: compare_policy_versions_policies_compare_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: version_a
        in: query
        required: true
        schema:
          type: string
          title: Version A
      - name: version_b
        in: query
        required: true
        schema:
          type: string
          title: Version B
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyVersionCompareResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/name/{policy_name}/all-versions:
    delete:
      tags:
      - Policies
      summary: Delete All Policy Versions
      description: Delete all versions of a policy. Also removes from in-memory registry.
      operationId: delete_all_policy_versions_policies_name__policy_name__all_versions_delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_name
        in: path
        required: true
        schema:
          type: string
          title: Policy Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}:
    get:
      tags:
      - Policies
      summary: Get Policy
      description: 'Get a policy by ID.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```'
      operationId: get_policy_policies__policy_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Policies
      summary: Update Policy
      description: 'Update an existing policy.


        Example Request:

        ```bash

        curl -X PUT "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "description": "Updated description",

        "guardrails_add": ["pii_masking", "toxicity_filter"]

        }''

        ```'
      operationId: update_policy_policies__policy_id__put
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Policies
      summary: Delete Policy
      description: 'Delete a policy.


        Example Request:

        ```bash

        curl -X DELETE "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "message": "Policy 123e4567-e89b-12d3-a456-426614174000 deleted successfully"

        }

        ```'
      operationId: delete_policy_policies__policy_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}/resolved-guardrails:
    get:
      tags:
      - Policies
      summary: Get Resolved Guardrails
      description: 'Get the resolved guardrails for a policy (including inherited guardrails).


        This endpoint resolves the full inheritance chain and returns the final

        set of guardrails that would be applied for this policy.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/123e4567-e89b-12d3-a456-426614174000/resolved-guardrails" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "policy_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "healthcare-compliance",

        "resolved_guardrails": ["pii_masking", "prompt_injection", "toxicity_filter"]

        }

        ```'
      operationId: get_resolved_guardrails_policies__policy_id__resolved_guardrails_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          title: Policy Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/test-pipeline:
    post:
      tags:
      - Policies
      summary: Test Pipeline
      description: 'Test a guardrail pipeline with sample messages.


        Executes the pipeline steps against the provided test messages and returns

        step-by-step results showing which guardrails passed/failed, actions taken,

        and timing information.


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/policies/test-pipeline" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "pipeline": {

        "mode": "pre_call",

        "steps": [

        {"guardrail": "pii-guard", "on_pass": "next", "on_fail": "block"}

        ]

        },

        "test_messages": [{"role": "user", "content": "My SSN is 123-45-6789"}]

        }''

        ```'
      operationId: test_pipeline_policies_test_pipeline_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineTestRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /policies/attachments/list:
    get:
      tags:
      - Policies
      summary: List Policy Attachments
      description: 'List all policy attachments from the database and config.yaml.


        Config-defined attachments are returned with definition_location "config" and a

        synthetic attachment_id ("config-").


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/attachments/list" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "attachments": [

        {

        "attachment_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "scope": "*",

        "teams": [],

        "keys": [],

        "models": [],

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ],

        "total_count": 1

        }

        ```'
      operationId: list_policy_attachments_policies_attachments_list_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachmentListResponse'
      security:
      - APIKeyHeader: []
  /policies/attachments:
    post:
      tags:
      - Policies
      summary: Create Policy Attachment
      description: 'Create a new policy attachment.


        Example Request:

        ```bash

        curl -X POST "http://localhost:4000/policies/attachments" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "policy_name": "global-baseline",

        "scope": "*"

        }''

        ```


        Example with team-specific attachment:

        ```bash

        curl -X POST "http://localhost:4000/policies/attachments" \

        -H "Authorization: Bearer " \

        -H "Content-Type: application/json" \

        -d ''{

        "policy_name": "healthcare-compliance",

        "teams": ["healthcare-team", "medical-research"]

        }''

        ```


        Example Response:

        ```json

        {

        "attachment_id": "123e4567-e89b-12d3-a456-426614174000",

        "policy_name": "global-baseline",

        "scope": "*",

        "teams": [],

        "keys": [],

        "models": [],

        "created_at": "2024-01-01T00:00:00Z",

        "updated_at": "2024-01-01T00:00:00Z"

        }

        ```'
      operationId: create_policy_attachment_policies_attachments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyAttachmentCreateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachmentDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /policies/attachments/{attachment_id}:
    get:
      tags:
      - Policies
      summary: Get Policy Attachment
      description: 'Get a policy attachment by ID.


        Example Request:

        ```bash

        curl -X GET "http://localhost:4000/policies/attachments/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```'
      operationId: get_policy_attachment_policies_attachments__attachment_id__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyAttachmentDBResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Policies
      summary: Delete Policy Attachment
      description: 'Delete a policy attachment.


        Example Request:

        ```bash

        curl -X DELETE "http://localhost:4000/policies/attachments/123e4567-e89b-12d3-a456-426614174000" \

        -H "Authorization: Bearer "

        ```


        Example Response:

        ```json

        {

        "message": "Attachment 123e4567-e89b-12d3-a456-426614174000 deleted successfully"

        }

        ```'
      operationId: delete_policy_attachment_policies_attachments__attachment_id__delete
      security:
      - APIKeyHeader: []
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
          title: Attachment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    PolicyCreateRequest:
      properties:
        policy_name:
          type: string
          title: Policy Name
          description: Unique name for the policy.
        inherit:
          anyOf:
          - type: string
          - type: 'null'
          title: Inherit
          description: Name of parent policy to inherit from.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Human-readable description of the policy.
        guardrails_add:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Guardrails Add
          description: List of guardrail names to add.
        guardrails_remove:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Guardrails Remove
          description: List of guardrail names to remove (from inherited).
        condition:
          anyOf:
          - $ref: '#/components/schemas/PolicyConditionRequest'
          - type: 'null'
          description: Condition for when this policy applies.
        pipeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipeline
          description: Optional guardrail pipeline for ordered execution. Contains 'mode' and 'steps'.
      type: object
      required:
      - policy_name
      title: PolicyCreateRequest
      description: Request body for creating a new policy.
    PolicyUpdateRequest:
      properties:
        policy_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Name
          description: New name for the policy.
        inherit:
          anyOf:
          - type: string
          - type: 'null'
          title: Inherit
          description: Name of parent policy to inherit from.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Human-readable description of the policy.
        guardrails_add:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Guardrails Add
          description: List of guardrail names to add.
        guardrails_remove:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Guardrails Remove
          description: List of guardrail names to remove (from inherited).
        condition:
          anyOf:
          - $ref: '#/components/schemas/PolicyConditionRequest'
          - type: 'null'
          description: Condition for when this policy applies.
        pipeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipeline
          description: Optional guardrail pipeline for ordered execution. Contains 'mode' and 'steps'.
      type: object
      title: PolicyUpdateRequest
      description: Request body for updating a policy.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PolicyDBResponse:
      properties:
        policy_id:
          type: string
          title: Policy Id
          description: Unique ID of the policy.
        policy_name:
          type: string
          title: Policy Name
          description: Name of the policy.
        version_number:
          type: integer
          title: Version Number
          description: Version number of this policy.
          default: 1
        version_status:
          type: string
          title: Version Status
          description: 'One of: draft, published, production.'
          default: production
        parent_version_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Version Id
          description: Policy ID this version was cloned from.
        is_latest:
          type: boolean
          title: Is Latest
          description: True if this is the latest version by version_number.
          default: true
        published_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Published At
          description: When this version was published.
        production_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Production At
          description: When this version was promoted to production.
        inherit:
          anyOf:
          - type: string
          - type: 'null'
          title: Inherit
          description: Parent policy name.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Policy description.
        guardrails_add:
          items:
            type: string
          type: array
          title: Guardrails Add
          description: Guardrails to add.
        guardrails_remove:
          items:
            type: string
          type: array
          title: Guardrails Remove
          description: Guardrails to remove.
        condition:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Condition
          description: Policy condition.
        pipeline:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pipeline
          description: Optional guardrail pipeline.
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
          description: When the policy was created.
        updated_at:
