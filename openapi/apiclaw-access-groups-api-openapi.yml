          title: Access Model Names
        assigned_key_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Assigned Key Ids
        assigned_team_ids:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Assigned Team Ids
        description:
          anyOf:
          - type: string
          - type: 'null'
