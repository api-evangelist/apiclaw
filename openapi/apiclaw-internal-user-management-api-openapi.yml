openapi: 3.2.0
info:
  title: LiteLLM Internal User management API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Internal User management
paths:
  /user/new:
    post:
      tags:
      - Internal User management
      summary: New User
      description: 'Use this to create a new INTERNAL user with a budget. Internal Users can access LiteLLM Admin UI to make keys, request access to models. This creates a new user and generates a new api key for the new user. The new api key is returned. Returns user id, budget + new key. Parameters:

        - user_id: Optional[str] - Specify a user id. If not set, a unique id will be generated. - user_alias: Optional[str] - A descriptive name for you to know who this user id refers to. - teams: Optional[list] - specify a list of team id''s a user belongs to. - user_email: Optional[str] - Specify a user email. - send_invite_email: Optional[bool] - Specify if an invite email should be sent. - user_role: Optional[str] - Specify a user role - "proxy_admin", "proxy_admin_viewer", "internal_user", "internal_user_viewer", "team", "customer". Info about each role here: `https://github.com/BerriAI/litellm/litellm/proxy/_types.py#L20`

        - max_budget: Optional[float] - Specify max budget for a given user. - budget_duration: Optional[str] - Budget is reset at the end of specified duration. If not set, budget is never reset. You can set duration as seconds ("30s"), minutes ("30m"), hours ("30h"), days ("30d"), months ("1mo"). - models: Optional[list] - Model_name''s a user is allowed to call. (if empty, key is allowed to call all models). Set to [''no-default-models''] to block all model access. Restricting user to only team-based model access. - tpm_limit: Optional[int] - Specify tpm limit for a given user (Tokens per minute)

        - rpm_limit: Optional[int] - Specify rpm limit for a given user (Requests per minute)

        - auto_create_key: bool - Default=True. Flag used for returning a key as part of the /user/new response

        - aliases: Optional[dict] - Model aliases for the user - Docs

        - config: Optional[dict] - [DEPRECATED PARAM] User-specific config. - allowed_cache_controls: Optional[list] - List of allowed cache control values. Example - ["no-cache", "no-store"]. See all values - https://docs.litellm.ai/docs/proxy/caching#turn-on--off-caching-per-request-

        - blocked: Optional[bool] - [Not Implemented Yet] Whether the user is blocked. - guardrails: Optional[List[str]] - [Not Implemented Yet] List of active guardrails for the user

        - policies: Optional[List[str]] - List of policy names to apply to the user. Policies define guardrails, conditions, and inheritance rules. - permissions: Optional[dict] - [Not Implemented Yet] User-specific permissions, eg. turning off pii masking. - metadata: Optional[dict] - Metadata for user, store information for user. Example metadata = {"team": "core-infra", "app": "app2", "email": "ishaan@berri.ai" }

        - max_parallel_requests: Optional[int] - Rate limit a user based on the number of parallel requests. Raises 429 error, if user''s parallel requests > x. - model_max_budget: Optional[dict] - Model-specific max budget for user. Docs

        - budget_fallbacks: Optional[Dict[str, List[str]]] - Per-model fallback chain tried in order when that model''s own `model_max_budget` is exceeded, e.g. {"gpt-4o": ["gpt-4o-mini"]}. - model_rpm_limit: Optional[float] - Model-specific rpm limit for user. Docs

        - mcp_rpm_limit: Optional[dict] - Per-MCP-server rpm limit, keyed by MCP server name {"github": 100, "slack": 200}. Enforced for keys and teams only; values set on a user are stored but not enforced per user. - tag_rpm_limit: Optional[dict] - Per-request-tag rpm limit, keyed by request tag {"cell-1": 1000, "cell-2": 500}. Enforced for keys only; values set on a user are stored but not enforced per user. - model_tpm_limit: Optional[float] - Model-specific tpm limit for user. Docs

        - spend: Optional[float] - Amount spent by user. Default is 0. Will be updated by proxy whenever user is used. You can set duration as seconds ("30s"), minutes ("30m"), hours ("30h"), days ("30d"), months ("1mo"). - agent_id: Optional[str] - The agent id associated with the user. - team_id: Optional[str] - [DEPRECATED PARAM] The team id of the user. Default is None.'
      operationId: new_user_user_new_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUserRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /user/info:
    get:
      tags:
      - Internal User management
      summary: User Info
      description: '[10/07/2024]

        Note: To get all users (+pagination), use `/user/list` endpoint.


        Use this to get user information. (user row + all user key info)


        Example request

        ```

        curl -X GET ''http://localhost:4000/user/info?user_id=krrish7%40berri.ai'' --header ''Authorization: Bearer sk-1234''

        ```'
      operationId: user_info_user_info_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: User ID in the request parameters
          title: User Id
        description: User ID in the request parameters
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v2/user/info:
    get:
      tags:
      - Internal User management
      summary: User Info V2
      description: 'Lightweight endpoint to get user info. Returns only the user object — no keys, no teams objects.


        This is the v2 replacement for /user/info, designed to avoid the "god endpoint" problem

        where the old endpoint loaded all keys and teams into memory.


        Note on `spend`: this is the user''s running budget counter, which the budget reset job

        resets whenever `budget_reset_at` elapses (see `budget_duration`): to zero by default,

        or to the overage above `max_budget` when `budget_rollover` is enabled. It is NOT

        lifetime or per-period historical spend. For historical spend over a date range, use

        `/user/daily/activity` or `/user/daily/activity/aggregated`, which read daily spend

        records that only ever accumulate and are never reset. The two values are expected to

        diverge once a budget reset has occurred within the queried period.


        Access control:

        - Proxy admins can query any user

        - Team admins can query users within their teams

        - Internal users can only query themselves (omit user_id or pass own)

        - Returns 404 for non-existent users or unauthorized access


        Example request:

        ```

        curl -X GET ''http://localhost:4000/v2/user/info?user_id=user123'' \

        --header ''Authorization: Bearer sk-1234''

        ```'
      operationId: user_info_v2_v2_user_info_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: User ID in the request parameters
          title: User Id
        description: User ID in the request parameters
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoV2Response'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user/update:
    post:
      tags:
      - Internal User management
      summary: User Update
      description: 'Example curl


        ```

        curl --location ''http://0.0.0.0:4000/user/update'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "user_id": "test-litellm-user-4",

        "user_role": "proxy_admin_viewer"

        }''

        ```


        Parameters:

        - user_id: Optional[str] - Specify a user id. If not set, a unique id will be generated. - user_email: Optional[str] - Specify a user email. - password: Optional[str] - Set the user''s password (admin only). Must satisfy the configured password policy. The user is required to change it at their next login. Users change their own password with POST /user/password/change. - user_alias: Optional[str] - A descriptive name for you to know who this user id refers to. - teams: Optional[list] - specify a list of team id''s a user belongs to. - send_invite_email: Optional[bool] - Specify if an invite email should be sent. - user_role: Optional[str] - Specify a user role - "proxy_admin", "proxy_admin_viewer", "internal_user", "internal_user_viewer", "team", "customer". Info about each role here: `https://github.com/BerriAI/litellm/litellm/proxy/_types.py#L20`

        - max_budget: Optional[float] - Specify max budget for a given user. - budget_duration: Optional[str] - Budget is reset at the end of specified duration. If not set, budget is never reset. You can set duration as seconds ("30s"), minutes ("30m"), hours ("30h"), days ("30d"), months ("1mo"). - models: Optional[list] - Model_name''s a user is allowed to call. (if empty, key is allowed to call all models)

        - tpm_limit: Optional[int] - Specify tpm limit for a given user (Tokens per minute)

        - rpm_limit: Optional[int] - Specify rpm limit for a given user (Requests per minute)

        - auto_create_key: bool - Default=True. Flag used for returning a key as part of the /user/new response

        - aliases: Optional[dict] - Model aliases for the user - Docs

        - config: Optional[dict] - [DEPRECATED PARAM] User-specific config. - allowed_cache_controls: Optional[list] - List of allowed cache control values. Example - ["no-cache", "no-store"]. See all values - https://docs.litellm.ai/docs/proxy/caching#turn-on--off-caching-per-request-

        - blocked: Optional[bool] - [Not Implemented Yet] Whether the user is blocked. - guardrails: Optional[List[str]] - [Not Implemented Yet] List of active guardrails for the user

        - policies: Optional[List[str]] - List of policy names to apply to the user. Policies define guardrails, conditions, and inheritance rules. - permissions: Optional[dict] - [Not Implemented Yet] User-specific permissions, eg. turning off pii masking. - metadata: Optional[dict] - Metadata for user, store information for user. Example metadata = {"team": "core-infra", "app": "app2", "email": "ishaan@berri.ai" }

        - max_parallel_requests: Optional[int] - Rate limit a user based on the number of parallel requests. Raises 429 error, if user''s parallel requests > x. - model_max_budget: Optional[dict] - Model-specific max budget for user. Docs

        - budget_fallbacks: Optional[Dict[str, List[str]]] - Per-model fallback chain tried in order when that model''s own `model_max_budget` is exceeded, e.g. {"gpt-4o": ["gpt-4o-mini"]}. - model_rpm_limit: Optional[float] - Model-specific rpm limit for user. Docs

        - mcp_rpm_limit: Optional[dict] - Per-MCP-server rpm limit, keyed by MCP server name {"github": 100, "slack": 200}. Enforced for keys and teams only; values set on a user are stored but not enforced per user. - tag_rpm_limit: Optional[dict] - Per-request-tag rpm limit, keyed by request tag {"cell-1": 1000, "cell-2": 500}. Enforced for keys only; values set on a user are stored but not enforced per user. - model_tpm_limit: Optional[float] - Model-specific tpm limit for user. Docs

        - spend: Optional[float] - Amount spent by user. Default is 0. Will be updated by proxy whenever user is used. You can set duration as seconds ("30s"), minutes ("30m"), hours ("30h"), days ("30d"), months ("1mo"). - agent_id: Optional[str] - The agent id associated with the user.'
      operationId: user_update_user_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - APIKeyHeader: []
  /user/bulk_update:
    post:
      tags:
      - Internal User management
      summary: Bulk User Update
      description: 'Bulk update multiple users at once.


        This endpoint allows updating multiple users in a single request. Each user update

        is processed independently - if some updates fail, others will still succeed.


        Parameters:

        - users: Optional[List[UpdateUserRequest]] - List of specific user update requests

        - all_users: Optional[bool] - Set to true to update all users in the system

        - user_updates: Optional[UpdateUserRequest] - Updates to apply when all_users=True


        Returns:

        - results: List of individual update results

        - total_requested: Total number of users requested for update

        - successful_updates: Number of successful updates

        - failed_updates: Number of failed updates


        Example request for specific users:

        ```bash

        curl --location ''http://0.0.0.0:4000/user/bulk_update'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "users": [

        {

        "user_id": "user1",

        "user_role": "internal_user",

        "max_budget": 100.0

        },

        {

        "user_email": "user2@example.com",

        "user_role": "internal_user_viewer",

        "max_budget": 50.0

        }

        ]

        }''

        ```


        Example request for all users:

        ```bash

        curl --location ''http://0.0.0.0:4000/user/bulk_update'' --header ''Authorization: Bearer sk-1234'' --header ''Content-Type: application/json'' --data ''{

        "all_users": true,

        "user_updates": {

        "user_role": "internal_user",

        "max_budget": 50.0

        }

        }''

        ```'
      operationId: bulk_user_update_user_bulk_update_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateUserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user/list:
    get:
      tags:
      - Internal User management
      summary: Get Users
      description: 'Get a paginated list of users with filtering and sorting options.


        Parameters:

        role: Optional[str]

        Filter users by role. Can be one of:

        - proxy_admin

        - proxy_admin_viewer

        - internal_user

        - internal_user_viewer

        user_ids: Optional[str]

        Get list of users by user_ids. Comma separated list of user_ids.

        sso_ids: Optional[str]

        Get list of users by sso_ids. Comma separated list of sso_ids.

        user_email: Optional[str]

        Filter users by partial email match

        search: Optional[str]

        Combined search: matches users whose user_id or user_email contains the value (case-insensitive)

        team: Optional[str]

        Filter users by team id. Will match if user has this team in their teams array.

        page: int

        The page number to return

        page_size: int

        The number of items per page

        sort_by: Optional[str]

        Column to sort by (e.g. ''user_id'', ''user_email'', ''created_at'', ''spend'')

        sort_order: Optional[str]

        Sort order (''asc'' or ''desc'')'
      operationId: get_users_user_list_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter users by role
          title: Role
        description: Filter users by role
      - name: user_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Get list of users by user_ids
          title: User Ids
        description: Get list of users by user_ids
      - name: sso_user_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Get list of users by sso_user_id
          title: Sso User Ids
        description: Get list of users by sso_user_id
      - name: user_email
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter users by partial email match
          title: User Email
        description: Filter users by partial email match
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Combined search: matches users whose ''user_id'' or ''user_email'' contains the value (case-insensitive).'
          title: Search
        description: 'Combined search: matches users whose ''user_id'' or ''user_email'' contains the value (case-insensitive).'
      - name: team
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter users by team id
          title: Team
        description: Filter users by team id
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number
          default: 1
          title: Page
        description: Page number
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Number of items per page
          default: 25
          title: Page Size
        description: Number of items per page
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Column to sort by (e.g. 'user_id', 'user_email', 'created_at', 'spend')
          title: Sort By
        description: Column to sort by (e.g. 'user_id', 'user_email', 'created_at', 'spend')
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          description: Sort order ('asc' or 'desc')
          default: asc
          title: Sort Order
        description: Sort order ('asc' or 'desc')
      - name: organization_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter users by organization membership. Comma-separated list of org IDs.
          title: Organization Ids
        description: Filter users by organization membership. Comma-separated list of org IDs.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user/delete:
    post:
      tags:
      - Internal User management
      summary: Delete User
      description: 'delete user and associated user keys


        ```

        curl --location ''http://0.0.0.0:4000/user/delete''

        --header ''Authorization: Bearer sk-1234''

        --header ''Content-Type: application/json''

        --data-raw ''{

        "user_ids": ["45e3e396-ee08-4a61-a88e-16b3ce7e0849"]

        }''

        ```


        Parameters:

        - user_ids: List[str] - The list of user id''s to be deleted.'
      operationId: delete_user_user_delete_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: litellm-changed-by
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
          title: Litellm-Changed-By
        description: The litellm-changed-by header enables tracking of actions performed by authorized users on behalf of other users, providing an audit trail for accountability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user/daily/activity:
    get:
      tags:
      - Internal User management
      summary: Get User Daily Activity
      description: '[BETA] This is a beta endpoint. It will change.


        Meant to optimize querying spend data for analytics for a user.


        Reads daily spend records that only ever accumulate and are never affected by budget

        resets. Their total can legitimately exceed the `spend` field returned by

        `/v2/user/info`, which is a running budget counter that every budget reset sets back

        to zero (or to the overage above `max_budget` when `budget_rollover` is enabled).


        Returns:

        (by date)

        - spend

        - prompt_tokens

        - completion_tokens

        - cache_read_input_tokens

        - cache_creation_input_tokens

        - total_tokens

        - api_requests

        - breakdown by model, api_key, provider'
      operationId: get_user_daily_activity_user_daily_activity_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start date in YYYY-MM-DD format
          title: Start Date
        description: Start date in YYYY-MM-DD format
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: End date in YYYY-MM-DD format
          title: End Date
        description: End date in YYYY-MM-DD format
      - name: model
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by specific model
          title: Model
        description: Filter by specific model
      - name: api_key
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by specific API key
          title: Api Key
        description: Filter by specific API key
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by specific user ID. Admins can filter by any user or omit for global view. Non-admins must provide their own user_id.
          title: User Id
        description: Filter by specific user ID. Admins can filter by any user or omit for global view. Non-admins must provide their own user_id.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number for pagination
          default: 1
          title: Page
        description: Page number for pagination
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          default: 50
          title: Page Size
        description: Items per page
      - name: timezone
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Timezone offset in minutes from UTC (e.g., 480 for PST). Matches JavaScript's Date.getTimezoneOffset() convention.
          title: Timezone
        description: Timezone offset in minutes from UTC (e.g., 480 for PST). Matches JavaScript's Date.getTimezoneOffset() convention.
      - name: include_current_utc_day
        in: query
        required: false
        schema:
          type: boolean
          description: When the range ends on the caller's current local day, extend it to today's UTC bucket so spend written after the caller's local midnight (in UTC terms) is included. Requires the timezone parameter. Historical ranges are never extended.
          default: false
          title: Include Current Utc Day
        description: When the range ends on the caller's current local day, extend it to today's UTC bucket so spend written after the caller's local midnight (in UTC terms) is included. Requires the timezone parameter. Historical ranges are never extended.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendAnalyticsPaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /user/daily/activity/aggregated:
    get:
      tags:
      - Internal User management
      summary: Get User Daily Activity Aggregated
      description: 'Aggregated analytics for a user''s daily activity without pagination.

        Returns the same response shape as the paginated endpoint with page metadata set to single-page.


        Reads daily spend records that only ever accumulate and are never affected by budget

        resets. Their total can legitimately exceed the `spend` field returned by

        `/v2/user/info`, which is a running budget counter that every budget reset sets back

        to zero (or to the overage above `max_budget` when `budget_rollover` is enabled).'
      operationId: get_user_daily_activity_aggregated_user_daily_activity_aggregated_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: api_key_limit
        in: query
        required: false
