components:
  schemas:
    BaseModel:
      properties: {}
      type: object
      title: BaseModel
    RoutingGroup:
      properties:
        group_name:
          type: string
          title: Group Name
        models:
          items:
            type: string
          type: array
          title: Models
        routing_strategy:
          type: string
          title: Routing Strategy
        routing_strategy_args:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Routing Strategy Args
        model_priorities:
          anyOf:
          - additionalProperties:
              type: integer
              maximum: 9007199254740991.0
              minimum: 1.0
            type: object
          - type: 'null'
          title: Model Priorities
          description: For priority groups, every model's priority. Lower numbers are tried first; equal numbers share traffic.
      type: object
      required:
      - group_name
      - models
      - routing_strategy
      title: RoutingGroup
      description: A group of models that share a routing strategy.
