  /vector_stores:
    post:
      summary: Vector Store Create
      description: 'Create a vector store.


        API Reference:

        https://platform.openai.com/docs/api-reference/vector-stores/create


        Supports target_model_names parameter for creating vector stores across multiple models:

        ```json

        {

        "name": "my-vector-store",

        "target_model_names": "gpt-4,gemini-2.0"

        }

        ```'
      operationId: vector_store_create_vector_stores_post
      security:
      - APIKeyHeader: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Vector Stores
    get:
      summary: Vector Store List
      description: 'List vector stores.


        API Reference:

        https://platform.openai.com/docs/api-reference/vector-stores/list'
      operationId: vector_store_list_vector_stores_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: after
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: After
      - name: before
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Before
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          default: 20
          title: Limit
      - name: order
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          default: desc
          title: Order
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Vector Stores
