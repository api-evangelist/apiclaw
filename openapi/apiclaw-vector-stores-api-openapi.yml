openapi: 3.2.0
info:
  title: LiteLLM Vector Stores API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Vector Stores
paths:
  /vector_stores/{vector_store_id}/search:
    post:
      summary: Vector Store Search
      description: 'Search a vector store.


        API Reference:

        https://platform.openai.com/docs/api-reference/vector-stores/search'
      operationId: vector_store_search_vector_stores__vector_store_id__search_post
      security:
      - APIKeyHeader: []
      parameters:
      - name: vector_store_id
        in: path
        required: true
        schema:
          type: string
          title: Vector Store Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Vector Stores
