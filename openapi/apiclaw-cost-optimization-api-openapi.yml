      type: object
      required:
      - request_id
      - start_time
      - model
      - gateway_injected
      - cache_read_tokens
      - cache_creation_tokens
      - spend
      - net_savings
      title: PromptCachingRequest
    PromptCachingRequestsResponse:
      properties:
        requests:
          items:
            $ref: '#/components/schemas/PromptCachingRequest'
          type: array
          title: Requests
        page_size:
          type: integer
          title: Page Size
        has_more:
          type: boolean
          title: Has More
        next_cursor:
          anyOf:
          - $ref: '#/components/schemas/PromptCachingRequestCursor'
          - type: 'null'
      type: object
      required:
      - requests
      - page_size
      - has_more
      - next_cursor
      title: PromptCachingRequestsResponse
    PromptCachingRequestCursor:
      properties:
        start_time:
