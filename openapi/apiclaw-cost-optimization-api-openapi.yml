  version: 1.105.1
tags:
- name: Cost Optimization
paths:
  /cost_optimization/prompt_caching/requests:
    get:
      tags:
      - Cost Optimization
      summary: Get Prompt Caching Requests
      operationId: get_prompt_caching_requests_cost_optimization_prompt_caching_requests_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start Date
      - name: end_date
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End Date
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Page Size
      - name: filter
        in: query
        required: false
        schema:
          enum:
          - all
          - injected
          - hits
          type: string
          default: all
          title: Filter
      - name: cursor_start_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cursor Start Time
      - name: cursor_request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Cursor Request Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptCachingRequestsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
