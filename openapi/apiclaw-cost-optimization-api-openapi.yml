          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PromptCachingRequest:
      properties:
        request_id:
          type: string
          title: Request Id
        start_time:
          type: string
          format: date-time
          title: Start Time
        model:
          type: string
          title: Model
        gateway_injected:
          type: boolean
          title: Gateway Injected
        cache_read_tokens:
          type: integer
          title: Cache Read Tokens
        cache_creation_tokens:
          type: integer
          title: Cache Creation Tokens
        spend:
          type: number
          title: Spend
        net_savings:
          anyOf:
          - type: number
          - type: 'null'
