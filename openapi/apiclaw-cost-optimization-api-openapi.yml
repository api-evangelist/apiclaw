        request_id:
          type: string
          title: Request Id
      type: object
      required:
      - start_time
      - request_id
      title: PromptCachingRequestCursor
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: Bearer token
      in: header
      name: x-litellm-api-key
    HTTPBearer:
      type: http
      scheme: bearer
