openapi: 3.2.0
info:
  title: LiteLLM Decisions API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: decisions
paths:
  /systemone:
    post:
      tags:
      - decisions
      summary: Ask named questions about a state (System One format)
      description: 'Judge a `state` against 1 to 128 named `questions` and get one calibrated answer per question name.


        Question types are `noul` (probability the answer is yes), `choice` (one label out of `criteria`, with

        `confidence` and `probabilities`) and `score` (an index into the `criteria` levels, with `confidence`,

        `legend` and `probabilities`). Requests that break these rules are rejected with a 400 before any provider

        is called. `model` is any decision model in the proxy model list. OpenAI decision models accept this format

        too, LiteLLM translates it and keeps the answers keyed by question name. Streaming is not supported.


        Docs'
      operationId: systemone_systemone_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                state:
                  anyOf:
                  - type: string
                  - additionalProperties: true
                    type: object
                  - items: {}
                    type: array
                  title: State
                  description: The thing being judged, such as a support ticket, a document or a chat transcript
                questions:
                  additionalProperties:
                    oneOf:
                    - properties:
                        type:
                          type: string
                          const: noul
                          title: Type
                        instructions:
                          anyOf:
                          - type: string
                          - additionalProperties: true
                            type: object
                          - items: {}
                            type: array
                          - type: 'null'
                          title: Instructions
                          description: The yes/no question to ask about the state
                        criteria:
                          anyOf:
                          - additionalProperties:
                              anyOf:
                              - type: string
                              - additionalProperties: true
                                type: object
                              - items: {}
                                type: array
                              - type: 'null'
                            propertyNames:
                              enum:
                              - 'true'
                              - 'false'
                            type: object
                          - type: 'null'
                          title: Criteria
                          description: Optional descriptions of what makes the answer true and what makes it false
                      additionalProperties: true
                      type: object
                      required:
                      - type
                      title: NoulQuestion
                    - properties:
                        type:
                          type: string
                          const: choice
                          title: Type
                        instructions:
                          anyOf:
                          - type: string
                          - additionalProperties: true
                            type: object
                          - items: {}
                            type: array
                          - type: 'null'
                          title: Instructions
                          description: The question to ask about the state
                        criteria:
                          additionalProperties:
                            anyOf:
                            - type: string
                            - additionalProperties: true
                              type: object
                            - items: {}
                              type: array
                            - type: 'null'
                          type: object
                          maxProperties: 255
                          minProperties: 1
                          title: Criteria
                          description: Candidate labels mapped to an optional description of each
                      additionalProperties: true
                      type: object
                      required:
                      - type
                      - criteria
                      title: ChoiceQuestion
                    - properties:
                        type:
                          type: string
                          const: score
                          title: Type
                        instructions:
                          anyOf:
                          - type: string
                          - additionalProperties: true
                            type: object
                          - items: {}
                            type: array
                          - type: 'null'
                          title: Instructions
                          description: The question to ask about the state
                        criteria:
                          items:
                            anyOf:
                            - type: string
                            - additionalProperties: true
                              type: object
                            - items: {}
                              type: array
                          type: array
                          maxItems: 10
                          minItems: 1
                          title: Criteria
                          description: Scale levels from lowest to highest. The score is a level index
                      additionalProperties: true
                      type: object
                      required:
                      - type
                      - criteria
                      title: ScoreQuestion
                    discriminator:
                      propertyName: type
                  propertyNames:
                    minLength: 1
                  type: object
                  maxProperties: 128
                  minProperties: 1
                  title: Questions
                  description: Named noul, choice and score questions. Each key becomes a key in the answers
                model:
                  type: string
                  title: Model
                  description: A decision model from the proxy model_list
              additionalProperties: true
              type: object
              required:
              - state
              - questions
              - model
              title: DecisionsRequest
            example:
              model: jev
              state: 'Customer wrote: I was charged twice for order #4411 and want one charge refunded today.'
              questions:
                is_refund_request:
                  type: noul
                  instructions: Is the customer asking for a refund?
                urgency:
                  type: choice
                  instructions: How urgent is this?
                  criteria:
                    low: can wait a week
                    high: needs action today
                frustration:
                  type: score
                  instructions: How frustrated is the customer?
                  criteria:
                  - calm
                  - mildly annoyed
                  - angry
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionsResponse'
      security:
      - APIKeyHeader: []
