components:
  schemas:
    OpenAIChoiceAnswer:
      properties:
        type:
          type: string
          const: choice
          title: Type
          default: choice
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        choice:
          anyOf:
          - type: string
          - type: boolean
          title: Choice
        probabilities:
          items:
            $ref: '#/components/schemas/OpenAIChoiceProbability'
          type: array
          title: Probabilities
        confidence:
          type: number
          title: Confidence
      type: object
      required:
      - name
      - choice
      - probabilities
      - confidence
      title: OpenAIChoiceAnswer
    OpenAIChoiceProbability:
      properties:
        value:
          anyOf:
          - type: string
          - type: boolean
          title: Value
        probability:
          type: number
          title: Probability
      type: object
      required:
      - value
      - probability
      title: OpenAIChoiceProbability
    ChoiceAnswer:
      properties:
        type:
          type: string
          const: choice
          title: Type
        choice:
          type: string
          title: Choice
        confidence:
          type: number
          title: Confidence
        probabilities:
          additionalProperties:
            type: number
          type: object
          title: Probabilities
      additionalProperties: true
      type: object
      required:
      - type
      - choice
      - confidence
      - probabilities
      title: ChoiceAnswer
    DecisionsResponse:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        answers:
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/NoulAnswer'
            - $ref: '#/components/schemas/ChoiceAnswer'
            - $ref: '#/components/schemas/ScoreAnswer'
            discriminator:
              propertyName: type
              mapping:
                choice: '#/components/schemas/ChoiceAnswer'
                noul: '#/components/schemas/NoulAnswer'
                score: '#/components/schemas/ScoreAnswer'
          type: object
          title: Answers
        usage:
          anyOf:
          - $ref: '#/components/schemas/DecisionsUsage'
          - type: 'null'
      additionalProperties: true
      type: object
      required:
      - answers
      title: DecisionsResponse
    OpenAIDecisionResponse:
      properties:
        model:
          type: string
          title: Model
        answers:
          items:
            oneOf:
            - $ref: '#/components/schemas/OpenAIPredicateAnswer'
            - $ref: '#/components/schemas/OpenAIChoiceAnswer'
            - $ref: '#/components/schemas/OpenAIScoreAnswer'
            - $ref: '#/components/schemas/OpenAIRefusalAnswer'
            discriminator:
              propertyName: type
              mapping:
