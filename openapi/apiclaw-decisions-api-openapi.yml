  /decisions:
    post:
      tags:
      - decisions
      summary: Ask questions about an input (OpenAI Decisions format)
      description: 'Judge an `input` against 1 to 128 `questions` and get the answers back in the same order.


        Question types are `predicate` (yes/no with `probability`), `choice` (one of the `choices`, with

        `probabilities`) and `score` (an index into `levels`, with `probabilities`). Requests that break these

        rules are rejected with a 400 before any provider is called. `model` is any decision model in the proxy

        model list. System One decision models accept this format too, LiteLLM translates the request and the

        answers. Streaming is not supported.


        Docs'
      operationId: decisions_decisions_post
      requestBody:
        content:
          application/json:
            schema:
              properties:
                input:
                  anyOf:
                  - type: string
                  - items:
                      properties:
                        role:
                          type: string
                          const: user
                          title: Role
                          default: user
                        type:
                          type: string
                          const: message
                          title: Type
                          default: message
                        content:
                          anyOf:
                          - type: string
                          - items:
                              oneOf:
                              - properties:
                                  type:
                                    type: string
                                    const: input_text
                                    title: Type
                                  text:
                                    type: string
                                    title: Text
                                additionalProperties: false
                                type: object
                                required:
                                - type
                                - text
                                title: OpenAIDecisionInputText
                              - properties:
                                  type:
                                    type: string
                                    const: input_image
                                    title: Type
                                  image_url:
                                    type: string
                                    title: Image Url
                                  detail:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    title: Detail
                                additionalProperties: false
                                type: object
                                required:
                                - type
                                - image_url
                                title: OpenAIDecisionInputImage
                              discriminator:
                                propertyName: type
                            type: array
                          title: Content
                      additionalProperties: false
                      type: object
                      required:
                      - content
                      title: OpenAIDecisionInputMessage
                    type: array
                  title: Input
                  description: The text being judged, or user messages whose content mixes input_text and input_image parts
                questions:
                  items:
                    oneOf:
                    - properties:
                        type:
                          type: string
                          const: predicate
                          title: Type
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                          title: Name
                          description: Echoed in the matching answer
                        instructions:
                          type: string
                          title: Instructions
                          description: The yes/no question to ask about the input
                      additionalProperties: false
                      type: object
                      required:
                      - type
                      - instructions
                      title: OpenAIPredicateQuestion
                    - properties:
                        type:
                          type: string
                          const: choice
                          title: Type
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                          title: Name
                          description: Echoed in the matching answer
                        instructions:
                          type: string
                          title: Instructions
                          description: The question to ask about the input
                        choices:
                          items:
                            properties:
                              value:
                                anyOf:
                                - type: string
                                - type: boolean
                                title: Value
                              description:
                                anyOf:
                                - type: string
                                - type: 'null'
                                title: Description
                            additionalProperties: false
                            type: object
                            required:
                            - value
                            title: OpenAIChoiceOption
                          type: array
                          maxItems: 255
                          minItems: 2
                          title: Choices
                          description: The options the model picks from. Values must be unique
                      additionalProperties: false
                      type: object
                      required:
                      - type
                      - instructions
                      - choices
                      title: OpenAIChoiceQuestion
                    - properties:
                        type:
                          type: string
                          const: score
                          title: Type
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                          title: Name
                          description: Echoed in the matching answer
                        instructions:
                          type: string
                          title: Instructions
                          description: The question to ask about the input
                        levels:
                          items:
                            properties:
                              label:
                                type: string
                                title: Label
                              description:
                                anyOf:
                                - type: string
                                - type: 'null'
                                title: Description
                            additionalProperties: false
                            type: object
                            required:
                            - label
                            title: OpenAIScoreLevel
                          type: array
                          maxItems: 10
                          minItems: 2
                          title: Levels
                          description: Scale levels from lowest to highest. The score is a level index
                      additionalProperties: false
                      type: object
                      required:
                      - type
                      - instructions
                      - levels
                      title: OpenAIScoreQuestion
                    discriminator:
                      propertyName: type
                  type: array
                  maxItems: 128
                  minItems: 1
                  title: Questions
                  description: Predicate, choice and score questions. Answers come back in the same order
                safety_identifier:
                  anyOf:
                  - type: string
                  - type: 'null'
                  title: Safety Identifier
                  description: A stable id for your end user. Sent to OpenAI and dropped for other providers
                model:
                  type: string
                  title: Model
                  description: A decision model from the proxy model_list
              additionalProperties: true
              type: object
              required:
              - input
              - questions
              - model
              title: OpenAIDecisionRequest
            example:
              model: luna
              input: 'Customer wrote: I was charged twice for order #4411 and want one charge refunded today.'
              questions:
              - type: predicate
                name: is_refund_request
                instructions: Is the customer asking for a refund?
              - type: choice
                name: urgency
                instructions: How urgent is this?
                choices:
                - value: low
                  description: can wait a week
                - value: high
                  description: needs action today
              - type: score
                name: frustration
                instructions: How frustrated is the customer?
                levels:
                - label: calm
                - label: mildly annoyed
                - label: angry
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIDecisionResponse'
      security:
      - APIKeyHeader: []
