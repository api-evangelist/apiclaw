openapi: 3.2.0
info:
  title: LiteLLM Azure AI Speech Pass-through API
  description: 'Proxy Server to call 100+ LLMs in the OpenAI format. **Customize Swagger Docs**


    👉 ```LiteLLM Admin Panel on /ui```. Create, Edit Keys with SSO. Having issues? Try ```Fallback Login```


    💸 ```LiteLLM Model Cost Map```.


    🔎 ```LiteLLM Model Hub```. See available models on the proxy. **Docs**'
  version: 1.105.1
tags:
- name: Azure AI Speech Pass-through
paths:
  /azure_speech/{endpoint}:
    get:
      tags:
      - Azure AI Speech Pass-through
      summary: Azure Speech Proxy Route
      description: 'Pass-through for the Azure AI Speech REST APIs (speech to text), e.g.

        `POST /azure_speech/speech/recognition/conversation/cognitiveservices/v1?language=en-US`

        with the raw audio as the body, or `POST /azure_speech/speechtotext/v3.2/transcriptions`.


        The body is forwarded byte for byte and the proxy injects its own

        `Ocp-Apim-Subscription-Key`; the caller''s `Authorization` header is the LiteLLM key

        and is never forwarded.


        Docs'
      operationId: azure_speech_proxy_route_azure_speech__endpoint__get
      security:
      - APIKeyHeader: []
      parameters:
      - name: endpoint
        in: path
        required: true
        schema:
          type: string
          title: Endpoint
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Azure AI Speech Pass-through
      summary: Azure Speech Proxy Route
      description: 'Pass-through for the Azure AI Speech REST APIs (speech to text), e.g.

