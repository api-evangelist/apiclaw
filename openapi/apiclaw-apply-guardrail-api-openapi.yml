              $ref: '#/components/schemas/PiiEntityType'
            type: array
          - type: 'null'
          title: Entities
        input_type:
          type: string
          title: Input Type
          default: request
        messages:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Messages
        metadata:
